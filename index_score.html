<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12312a">
<title>麻雀 スコア記録</title>
<style>
:root{
  --felt:#12312a;--felt-2:#1b4238;--ivory:#f4efe3;--ivory-dim:#b9b3a3;
  --jade:#3d9b74;--vermilion:#cd3b30;--gold:#e3b25a;
  --line:rgba(244,239,227,.14);--line-strong:rgba(244,239,227,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--felt);color:var(--ivory);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 60px;}
.masthead{padding:18px 2px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.masthead h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.14em;}
.masthead .sub{font-size:11px;color:var(--ivory-dim);letter-spacing:.08em;}
section{margin-top:22px;}
.lbl{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ivory-dim);margin:0 0 9px 2px;display:flex;align-items:center;gap:8px;}
.lbl::after{content:"";flex:1;height:1px;background:var(--line);}
.note{font-size:11.5px;color:var(--ivory-dim);margin:8px 2px 0;line-height:1.55;}
.hide{display:none!important;}

.btn{
  min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px solid var(--line-strong);border-radius:9px;background:transparent;color:var(--ivory);
  font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s,transform .08s;font-variant-numeric:tabular-nums;
}
.btn small{font-size:10.5px;font-weight:600;opacity:.6;margin-top:2px;}
.btn:active{transform:scale(.97);}
.btn[aria-pressed="true"]{background:var(--ivory);color:#16352c;border-color:var(--ivory);}
.btn:disabled{opacity:.28;cursor:not-allowed;}
.row{display:grid;gap:8px;}
.row.c2{grid-template-columns:1fr 1fr;}
.row.c3{grid-template-columns:repeat(3,1fr);}
.row.c4{grid-template-columns:repeat(4,1fr);}
.rate-grid .btn{min-height:50px;font-size:15px;}

.primary{
  width:100%;min-height:60px;border:0;border-radius:10px;background:var(--jade);color:#0d241d;
  font-family:inherit;font-size:18px;font-weight:800;letter-spacing:.06em;cursor:pointer;
  box-shadow:0 4px 0 #2b6f52;transition:transform .08s,box-shadow .08s,background .12s;
}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #2b6f52;}
.primary:disabled{background:#2c4d42;color:rgba(244,239,227,.35);box-shadow:0 4px 0 #1f3a31;cursor:not-allowed;}
.ghost{
  width:100%;min-height:48px;border:2px solid var(--line);border-radius:9px;background:transparent;
  color:var(--ivory-dim);font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;
}
.ghost:active{background:rgba(244,239,227,.08);}
.ghost.danger{color:var(--vermilion);border-color:rgba(205,59,48,.4);}

input[type=text],input[type=number]{
  width:100%;min-height:54px;padding:0 14px;border:2px solid var(--line-strong);border-radius:9px;
  background:rgba(0,0,0,.18);color:var(--ivory);font-family:inherit;font-size:18px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
input:focus{outline:none;border-color:var(--gold);}
input::placeholder{color:rgba(244,239,227,.28);font-weight:600;}

/* 素点入力 */
.pscore{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.pscore .pn{width:88px;flex:none;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pscore input{text-align:right;font-size:21px;}
.sumbar{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;font-weight:700;padding:9px 2px 0;font-variant-numeric:tabular-nums;
}
.sumbar .ok{color:var(--jade);}
.sumbar .ng{color:var(--gold);}

/* 成績表 */
.board{background:var(--ivory);color:#16352c;border-radius:11px 11px 7px 7px;border-bottom:6px solid #2b7a5c;
  box-shadow:0 6px 18px rgba(0,0,0,.3);padding:12px 14px 14px;}
.board .bh{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#4b6b5f;letter-spacing:.08em;padding-bottom:8px;border-bottom:1px solid rgba(22,53,44,.16);}
.brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(22,53,44,.1);}
.brow:last-child{border-bottom:0;}
.brow .rk{width:24px;flex:none;font-size:13px;font-weight:800;color:#7d9188;text-align:center;}
.brow .rk.top{color:#b8862c;}
.brow .nm{flex:1;min-width:0;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow .vals{text-align:right;font-variant-numeric:tabular-nums;}
.brow .pt{font-size:19px;font-weight:800;line-height:1.15;}
.brow .yen{font-size:12.5px;font-weight:700;color:#4b6b5f;}
.plus{color:#1f7a52;}.minus{color:#c0392b;}
.board .bf{font-size:11.5px;color:#4b6b5f;font-weight:600;padding-top:9px;text-align:center;}

/* 履歴 */
.hrow{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.hrow .hn{width:34px;flex:none;font-size:12px;font-weight:700;color:var(--ivory-dim);}
.hrow .hc{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;font-weight:700;}
.hrow .del{width:38px;height:38px;flex:none;border:0;background:transparent;color:rgba(244,239,227,.35);font-size:19px;cursor:pointer;border-radius:8px;}
.hrow .del:active{background:rgba(205,59,48,.2);color:var(--vermilion);}

details{margin-top:22px;border-top:1px solid var(--line);}
summary{list-style:none;cursor:pointer;padding:15px 2px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ivory-dim);display:flex;align-items:center;justify-content:space-between;}
summary::-webkit-details-marker{display:none;}
summary::after{content:"▾";transition:transform .2s;}
details[open] summary::after{transform:rotate(180deg);}
.dbody{padding:0 2px 14px;}
.frow{margin-bottom:12px;}
.frow > span{display:block;font-size:12px;font-weight:700;color:var(--ivory-dim);margin-bottom:6px;}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ivory);color:#16352c;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:800;
  opacity:0;pointer-events:none;transition:all .22s;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">

<div class="masthead">
  <h1>麻雀 スコア記録</h1>
  <span class="sub" id="today"></span>
</div>

<!-- ===== セットアップ ===== -->
<div id="setup" class="hide">
  <section>
    <p class="lbl">人数</p>
    <div class="row c3" id="gSeats">
      <button class="btn" data-v="2">2人</button>
      <button class="btn" data-v="3">3人<small>三麻</small></button>
      <button class="btn" data-v="4">4人<small>四麻</small></button>
    </div>
  </section>
  <section>
    <p class="lbl">プレイヤー名</p>
    <div id="nameFields" class="row"></div>
  </section>
  <section>
    <p class="lbl">レート</p>
    <div class="row c3 rate-grid" id="gRate">
      <button class="btn" data-v="0">なし<small>ノーレート</small></button>
      <button class="btn" data-v="10">点1<small>10円</small></button>
      <button class="btn" data-v="20">点2<small>20円</small></button>
      <button class="btn" data-v="30">点3<small>30円</small></button>
      <button class="btn" data-v="40">点4<small>40円</small></button>
      <button class="btn" data-v="50">点5<small>50円</small></button>
      <button class="btn" data-v="60">点6<small>60円</small></button>
      <button class="btn" data-v="70">点7<small>70円</small></button>
      <button class="btn" data-v="80">点8<small>80円</small></button>
      <button class="btn" data-v="90">点9<small>90円</small></button>
      <button class="btn" data-v="100">テンピン<small>100円</small></button>
      <button class="btn" data-v="200">リャンピン<small>200円</small></button>
    </div>
    <p class="note">1000点あたりの金額です。</p>
  </section>
  <section>
    <p class="lbl">ウマ</p>
    <div class="row c2" id="gUma"></div>
  </section>
  <details id="advSetup">
    <summary>詳細ルール</summary>
    <div class="dbody">
      <div class="frow"><span>配給原点（持ち点）</span><input type="number" id="fStart" inputmode="numeric"></div>
      <div class="frow"><span>返し点（オカの基準）</span><input type="number" id="fRet" inputmode="numeric"></div>
      <div class="frow"><span>トビ賞（P・0で無し）</span><input type="number" id="fTobi" inputmode="numeric"></div>
      <div class="frow"><span>端数処理</span>
        <div class="row c3" id="gRound">
          <button class="btn" data-v="none">そのまま<small>0.1刻み</small></button>
          <button class="btn" data-v="go">五捨六入</button>
          <button class="btn" data-v="shi">四捨五入</button>
        </div>
      </div>
    </div>
  </details>
  <section>
    <button class="primary" id="bStart">この設定で開始</button>
    <button class="ghost" id="bCancelSetup" style="margin-top:9px">キャンセル</button>
  </section>
</div>

<!-- ===== メイン ===== -->
<div id="main" class="hide">

  <section style="margin-top:6px">
    <div class="board" id="board"></div>
  </section>

  <section>
    <p class="lbl">半荘入力 <span style="letter-spacing:0;font-weight:600" id="ruleTag"></span></p>
    <div id="scoreFields"></div>
    <div class="sumbar"><span>合計</span><span id="sumInfo">—</span></div>
    <div id="tobiWrap" class="hide" style="margin-top:14px">
      <p class="lbl">飛ばした人</p>
      <div class="row c4" id="gTobi"></div>
    </div>
    <button class="primary" id="bAdd" style="margin-top:14px" disabled>この半荘を登録する</button>
  </section>

  <section id="histSec">
    <p class="lbl">履歴</p>
    <div id="hist"></div>
  </section>

  <details>
    <summary>場代</summary>
    <div class="dbody">
      <div class="frow"><span>場代の総額（円）</span><input type="number" id="fFee" inputmode="numeric" placeholder="0"></div>
      <div class="frow"><span>立て替えた人</span><div class="row c4" id="gPayer"></div></div>
      <button class="ghost" id="bFee">場代を反映する</button>
      <p class="note">総額を人数で割って各自の負担にし、立て替えた人には全額が戻るよう最終収支に反映します。</p>
    </div>
  </details>

  <section>
    <button class="ghost" id="bCopy">結果をコピー（LINE貼り付け用）</button>
    <button class="ghost" id="bSettings" style="margin-top:9px">メンバー・ルールを変更</button>
    <button class="ghost danger" id="bNewDay" style="margin-top:9px">記録をリセットして新しい日にする</button>
  </section>
</div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var KEY="mahjong-score-v1",mem=null;
var store={
  save:function(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){mem=d;}},
  load:function(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):mem;}catch(e){return mem;}}
};

var UMA={
  2:[["10 / -10",[10,-10]],["0 / 0",[0,0]]],
  3:[["10 / 0 / -10",[10,0,-10]],["20 / 0 / -20",[20,0,-20]],["5 / 0 / -5",[5,0,-5]],["0 / 0 / 0",[0,0,0]]],
  4:[["10 / 5 / -5 / -10",[10,5,-5,-10]],["20 / 10 / -10 / -20",[20,10,-10,-20]],["30 / 10 / -10 / -30",[30,10,-10,-30]],["0 / 0 / 0 / 0",[0,0,0,0]]]
};
var DEF={2:{start:30000,ret:30000},3:{start:35000,ret:40000},4:{start:25000,ret:30000}};

var D=null;                       // 保存データ
var tmp={seats:3,names:[],rate:30,uma:0,start:35000,ret:40000,tobi:0,round:"none"};
var pendTobi=null, pendPayer=null;

function $(i){return document.getElementById(i);}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on");},1600);}
function yen(v){return (v<0?"-":"+")+Math.abs(Math.round(v)).toLocaleString();}
function pt(v){var s=(Math.round(v*10)/10).toFixed(1);return (v>0?"+":"")+s;}
function rateName(v){
  if(!v) return "ノーレート";
  if(v===200) return "リャンピン";
  if(v===100) return "テンピン";
  return "点"+(v/10);
}
function press(id,v){document.querySelectorAll("#"+id+" .btn").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===String(v)?"true":"false");});}

/* ---------- 計算 ---------- */
function roundP(p,mode){
  if(mode==="none") return Math.round(p*10)/10;
  var a=Math.abs(p),s=p<0?-1:1;
  if(mode==="go") return s*Math.floor(a+0.4);
  return s*Math.round(a);
}
function calcGame(scores,tobiIdx){
  var r=D.rule,n=scores.length;
  var order=scores.map(function(s,i){return {s:s,i:i};})
                  .sort(function(a,b){return b.s-a.s||a.i-b.i;});
  var oka=(r.ret-r.start)*n/1000;
  var pts=new Array(n),ranks=new Array(n);
  order.forEach(function(o,k){
    var p=roundP((o.s-r.ret)/1000,r.round);
    p+=r.uma[k];
    if(k===0) p+=oka;
    pts[o.i]=p; ranks[o.i]=k+1;
  });
  if(r.tobi>0&&tobiIdx!==null&&tobiIdx!==undefined){
    scores.forEach(function(s,i){
      if(s<0&&i!==tobiIdx){pts[i]-=r.tobi;pts[tobiIdx]+=r.tobi;}
    });
  }
  var sum=pts.reduce(function(a,b){return a+b;},0);
  if(Math.abs(sum)>0.001){var top=order[0].i;pts[top]-=sum;}
  return {scores:scores,pts:pts,ranks:ranks,tobi:(tobiIdx===undefined?null:tobiIdx)};
}
function totals(){
  var n=D.players.length,t=[];
  for(var i=0;i<n;i++) t.push({i:i,name:D.players[i],p:0,games:0});
  D.games.forEach(function(g){g.pts.forEach(function(p,i){t[i].p+=p;t[i].games++;});});
  var feeEach=0,payer=(D.fee&&D.fee.total>0)?D.fee.payer:null;
  if(D.fee&&D.fee.total>0) feeEach=D.fee.total/n;
  t.forEach(function(x){
    x.money=x.p*D.rule.rate;
    x.fee=-feeEach;
    if(payer!==null&&x.i===payer) x.fee+=D.fee.total;
    x.net=x.money+x.fee;
  });
  return t.sort(function(a,b){return b.p-a.p;});
}

/* ---------- セットアップ ---------- */
function openSetup(){
  if(D){tmp={seats:D.players.length,names:D.players.slice(),rate:D.rule.rate,uma:D.rule.umaIdx,
             start:D.rule.start,ret:D.rule.ret,tobi:D.rule.tobi,round:D.rule.round};}
  $("main").classList.add("hide");$("setup").classList.remove("hide");
  $("bCancelSetup").classList.toggle("hide",!D);
  renderSetup();window.scrollTo(0,0);
}
function renderSetup(){
  press("gSeats",tmp.seats);press("gRate",tmp.rate);press("gRound",tmp.round);
  var nf=$("nameFields"),h="";
  for(var i=0;i<tmp.seats;i++){
    h+='<input type="text" data-i="'+i+'" placeholder="プレイヤー'+(i+1)+'" value="'+(tmp.names[i]||"").replace(/"/g,"&quot;")+'">';
  }
  nf.innerHTML=h;
  var ug=$("gUma"),s="";
  UMA[tmp.seats].forEach(function(u,k){s+='<button class="btn" data-v="'+k+'">'+u[0]+'</button>';});
  ug.innerHTML=s;
  if(tmp.uma>=UMA[tmp.seats].length) tmp.uma=0;
  press("gUma",tmp.uma);
  $("fStart").value=tmp.start;$("fRet").value=tmp.ret;$("fTobi").value=tmp.tobi;
}
$("gSeats").addEventListener("click",function(e){
  var b=e.target.closest(".btn");if(!b)return;
  saveNames();tmp.seats=+b.dataset.v;
  tmp.start=DEF[tmp.seats].start;tmp.ret=DEF[tmp.seats].ret;tmp.uma=0;renderSetup();
});
$("gRate").addEventListener("click",function(e){var b=e.target.closest(".btn");if(!b)return;tmp.rate=+b.dataset.v;press("gRate",tmp.rate);});
$("gUma").addEventListener("click",function(e){var b=e.target.closest(".btn");if(!b)return;tmp.uma=+b.dataset.v;press("gUma",tmp.uma);});
$("gRound").addEventListener("click",function(e){var b=e.target.closest(".btn");if(!b)return;tmp.round=b.dataset.v;press("gRound",tmp.round);});
function saveNames(){
  var v=[];document.querySelectorAll("#nameFields input").forEach(function(el){v.push(el.value.trim());});
  tmp.names=v;
}
$("bStart").addEventListener("click",function(){
  saveNames();
  var names=[];
  for(var i=0;i<tmp.seats;i++) names.push(tmp.names[i]||("P"+(i+1)));
  var rule={rate:tmp.rate,umaIdx:tmp.uma,uma:UMA[tmp.seats][tmp.uma][1],
            start:+$("fStart").value||DEF[tmp.seats].start,
            ret:+$("fRet").value||DEF[tmp.seats].ret,
            tobi:+$("fTobi").value||0,round:tmp.round};
  var keep=(D&&D.players.length===tmp.seats)?D.games:[];
  D={date:(D&&D.date)||todayStr(),players:names,rule:rule,games:keep,fee:{total:0,payer:null}};
  store.save(D);showMain();toast("設定を保存しました");
});
$("bCancelSetup").addEventListener("click",function(){showMain();});

function todayStr(){
  var d=new Date();
  return d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2);
}

/* ---------- メイン ---------- */
function showMain(){
  $("setup").classList.add("hide");$("main").classList.remove("hide");
  $("today").textContent=D.date;
  renderInputs();renderAll();window.scrollTo(0,0);
}
function renderInputs(){
  var h="";
  D.players.forEach(function(n,i){
    h+='<div class="pscore"><span class="pn">'+esc(n)+'</span>'+
       '<input type="number" inputmode="numeric" data-i="'+i+'" placeholder="素点"></div>';
  });
  $("scoreFields").innerHTML=h;
  document.querySelectorAll("#scoreFields input").forEach(function(el){
    el.addEventListener("input",onScoreInput);
  });
  var r=D.rule;
  $("ruleTag").textContent="／ "+r.start/1000+"-"+r.ret/1000+"・ウマ"+r.uma.join("/")+"・"+rateName(r.rate);
  var tw=$("tobiWrap");
  if(r.tobi>0){
    tw.classList.remove("hide");
    var s="";D.players.forEach(function(n,i){s+='<button class="btn" data-v="'+i+'">'+esc(n)+'</button>';});
    s+='<button class="btn" data-v="none">無し</button>';
    $("gTobi").innerHTML=s;pendTobi=null;press("gTobi","none");
  }else tw.classList.add("hide");
  var ps="";D.players.forEach(function(n,i){ps+='<button class="btn" data-v="'+i+'">'+esc(n)+'</button>';});
  $("gPayer").innerHTML=ps;
  pendPayer=(D.fee&&D.fee.payer!==null)?D.fee.payer:null;
  press("gPayer",pendPayer===null?"x":pendPayer);
  $("fFee").value=(D.fee&&D.fee.total)?D.fee.total:"";
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function readScores(){
  var v=[];document.querySelectorAll("#scoreFields input").forEach(function(el){
    v.push(el.value===""?null:Number(el.value));
  });
  return v;
}
function onScoreInput(){
  var v=readScores(),n=v.length,need=D.rule.start*n;
  var blanks=[];v.forEach(function(x,i){if(x===null)blanks.push(i);});
  var filled=v.reduce(function(a,b){return a+(b||0);},0);
  var el=$("sumInfo"),ok=false;
  if(blanks.length===1){
    var rest=need-filled;
    el.innerHTML='<span class="ng">'+esc(D.players[blanks[0]])+' → '+rest.toLocaleString()+'</span>';
    document.querySelector('#scoreFields input[data-i="'+blanks[0]+'"]').placeholder=rest;
  }else if(blanks.length===0){
    if(filled===need){el.innerHTML='<span class="ok">'+filled.toLocaleString()+' ✓</span>';ok=true;}
    else el.innerHTML='<span class="ng">'+filled.toLocaleString()+' ／ 差 '+(filled-need>0?"+":"")+(filled-need).toLocaleString()+'</span>';
  }else{el.textContent="—";}
  $("bAdd").disabled=!ok;
}
$("gTobi").addEventListener("click",function(e){
  var b=e.target.closest(".btn");if(!b)return;
  pendTobi=b.dataset.v==="none"?null:+b.dataset.v;press("gTobi",b.dataset.v);
});
$("bAdd").addEventListener("click",function(){
  var v=readScores();
  if(v.some(function(x){return x===null;}))return;
  D.games.push(calcGame(v,pendTobi));
  store.save(D);
  document.querySelectorAll("#scoreFields input").forEach(function(el){el.value="";el.placeholder="素点";});
  pendTobi=null;if(D.rule.tobi>0)press("gTobi","none");
  onScoreInput();renderAll();toast("第"+D.games.length+"半荘を登録");
});

$("gPayer").addEventListener("click",function(e){
  var b=e.target.closest(".btn");if(!b)return;
  pendPayer=(pendPayer===+b.dataset.v)?null:+b.dataset.v;
  press("gPayer",pendPayer===null?"x":pendPayer);
});
$("bFee").addEventListener("click",function(){
  D.fee={total:+$("fFee").value||0,payer:pendPayer};
  store.save(D);renderAll();toast("場代を反映しました");
});

function renderAll(){
  var t=totals(),r=D.rule,hasFee=D.fee&&D.fee.total>0;
  var h='<div class="bh"><span>本日の成績　'+D.games.length+'半荘</span><span>'+rateName(r.rate)+(r.rate?"　1P="+r.rate+"円":"")+'</span></div>';
  if(D.games.length===0){
    h+='<div style="padding:22px 0;text-align:center;font-size:14px;font-weight:700;color:#7d9188">まだ記録がありません</div>';
  }else{
    t.forEach(function(x,k){
      h+='<div class="brow"><span class="rk'+(k===0?" top":"")+'">'+(k+1)+'</span>'+
         '<span class="nm">'+esc(x.name)+'</span><span class="vals">'+
         '<span class="pt '+(x.p>=0?"plus":"minus")+'">'+pt(x.p)+'<span style="font-size:12px">P</span></span>';
      if(r.rate) h+='<br><span class="yen '+(x.net>=0?"plus":"minus")+'">'+yen(x.net)+'円</span>';
      h+='</span></div>';
    });
    if(hasFee) h+='<div class="bf">場代 '+D.fee.total.toLocaleString()+'円込み'+(D.fee.payer!==null?'（立替：'+esc(D.players[D.fee.payer])+'）':'')+'</div>';
  }
  $("board").innerHTML=h;

  var hh="";
  D.games.slice().reverse().forEach(function(g,k){
    var no=D.games.length-k;
    hh+='<div class="hrow"><span class="hn">#'+no+'</span><span class="hc">';
    g.pts.forEach(function(p,i){
      hh+='<span>'+esc(D.players[i])+' <span class="'+(p>=0?"plus":"minus")+'" style="color:'+(p>=0?"#5fc79a":"#e8776d")+'">'+pt(p)+'</span></span>';
    });
    hh+='</span><button class="del" data-k="'+(no-1)+'" aria-label="削除">×</button></div>';
  });
  $("hist").innerHTML=hh;
  $("histSec").classList.toggle("hide",D.games.length===0);
}
$("hist").addEventListener("click",function(e){
  var b=e.target.closest(".del");if(!b)return;
  var k=+b.dataset.k;
  if(confirm("第"+(k+1)+"半荘の記録を削除しますか？")){
    D.games.splice(k,1);store.save(D);renderAll();toast("削除しました");
  }
});

$("bCopy").addEventListener("click",function(){
  var t=totals(),r=D.rule;
  var s=D.date+" 麻雀スコア（"+D.players.length+"人・"+rateName(r.rate)+"）\n全"+D.games.length+"半荘\n\n";
  t.forEach(function(x,k){
    s+=(k+1)+"位 "+x.name+" "+pt(x.p)+"P";
    if(r.rate) s+=" ("+yen(x.net)+"円)";
    s+="\n";
  });
  if(D.fee&&D.fee.total>0) s+="\n※場代"+D.fee.total.toLocaleString()+"円込み";
  copy(s);
});
function copy(s){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){toast("コピーしました");},function(){fallback(s);});
  }else fallback(s);
  function fallback(x){
    var ta=document.createElement("textarea");ta.value=x;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast("コピーしました");}catch(e){prompt("コピーしてください",x);}
    document.body.removeChild(ta);
  }
}

$("bSettings").addEventListener("click",openSetup);
$("bNewDay").addEventListener("click",function(){
  if(!confirm("今日の記録をすべて消して、新しい日を始めますか？\n（メンバーとルールは残ります）"))return;
  D.games=[];D.fee={total:0,payer:null};D.date=todayStr();
  store.save(D);renderInputs();renderAll();$("today").textContent=D.date;toast("新しい日を開始しました");
});

/* ---------- 起動 ---------- */
D=store.load();
if(D&&D.players&&D.rule){showMain();}
else{D=null;openSetup();}
})();
</script>
</body>
</html>
