<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e473c">
<meta name="apple-mobile-web-app-title" content="麻雀">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>麻雀 点数計算</title>
<link rel="stylesheet" href="app.css">
<style>
/* ---- 結果カード ---- */
.result-dock{position:sticky;top:env(safe-area-inset-top);z-index:20;padding:8px 0 14px;background:linear-gradient(var(--bg) 78%,rgba(30,71,60,0));}
.tile-face{background:var(--ivory);color:var(--ink);border-radius:20px;padding:14px 18px 16px;text-align:center;}
.res-meta{display:flex;justify-content:center;gap:16px;font-size:12.5px;font-weight:600;color:#5b7a6f;}
.res-meta b{font-weight:800;color:var(--ink);font-size:15px;margin-left:2px;}
.res-main{font-size:46px;font-weight:800;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.res-main .yen{font-size:18px;font-weight:700;margin-left:3px;}
.res-split{font-size:14px;font-weight:700;color:#2f7458;font-variant-numeric:tabular-nums;}
.res-rank{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;background:var(--ink);color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.12em;}
.res-rank.empty{display:none;}
.res-warn{margin-top:8px;font-size:12px;color:#c0392b;font-weight:700;}

.row{display:grid;gap:8px;}
#gHanMore{display:grid;grid-template-columns:repeat(5,1fr);}
#gHanMore.hide{display:none;}
#gHanMore .btn{flex-direction:column;gap:0;padding:6px 2px;min-height:52px;justify-content:center;line-height:1.2;}
#gHanMore .btn small{font-size:10px;}
.row.c2{grid-template-columns:1fr 1fr;}

/* ---- スイッチ ---- */
.check{
  display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:8px 12px 8px 16px;
  border:0;border-radius:var(--radius);background:var(--surface);color:var(--ivory);
  font-family:inherit;font-size:16px;font-weight:700;text-align:left;cursor:pointer;
}
.check .txt{flex:1;min-width:0;}
.check .cap{font-size:11px;font-weight:600;color:var(--ivory-dim);display:block;margin-top:1px;}
.check .sw{position:relative;flex:none;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.18);transition:background .18s;}
.check .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;}
.check[aria-pressed="true"] .sw{background:var(--jade);}
.check[aria-pressed="true"] .sw::after{transform:translateX(18px);}
.check:disabled{opacity:.3;cursor:not-allowed;}
.check:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---- カウンタ ---- */
.counters{background:var(--surface);border-radius:var(--radius);padding:2px 12px 2px 16px;}
.counter{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.counter:last-child{border-bottom:0;}
.counter .cname{flex:1;min-width:0;font-size:15.5px;font-weight:700;}
.counter .cfu{font-size:11.5px;font-weight:600;color:var(--ivory-dim);margin-left:6px;}
.counter .num{width:30px;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.counter .num.zero{color:rgba(246,242,232,.28);}
.step{
  width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--surface-2);color:var(--ivory);
  font-size:22px;font-weight:600;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  transition:background .12s;
}
.step:active{background:rgba(255,255,255,.22);}
.step:disabled{opacity:.25;cursor:not-allowed;}
.step:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.counter.off{opacity:.3;}

/* ---- 内訳 ---- */
.bd{font-size:14px;padding:0 16px 10px;}
.bd .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.bd .r:last-child{border-bottom:0;}
.bd .r.sum{font-weight:800;color:var(--gold);}
.bd .r span:last-child{font-weight:700;}
.opts{padding:0 10px 12px;display:grid;gap:8px;}
.opts .check{background:var(--surface);}

.reset{
  margin-top:24px;width:100%;min-height:50px;border-radius:var(--radius);border:0;background:transparent;
  color:var(--ivory-dim);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
}
.reset:active{background:var(--surface);}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>点数計算</h1>
  </div>

  <div class="result-dock">
    <div class="tile-face">
      <div class="res-meta"><span>符<b id="oFu">30</b></span><span>翻<b id="oHan">1</b></span></div>
      <div class="res-main"><span id="oMain">1000</span><span class="yen">点</span></div>
      <div class="res-split" id="oSplit">放銃者から</div>
      <div class="res-rank empty" id="oRank"></div>
      <div class="res-warn" id="oWarn" style="display:none"></div>
    </div>
  </div>

  <section style="margin-top:12px">
    <p class="lbl">和了者</p>
    <div class="seg" id="gSeat">
      <button class="btn" data-v="dealer">親</button>
      <button class="btn" data-v="child">子</button>
    </div>
  </section>

  <section>
    <p class="lbl">和了り方</p>
    <div class="seg" id="gWin">
      <button class="btn" data-v="ron">ロン</button>
      <button class="btn" data-v="tsumo">ツモ</button>
    </div>
  </section>

  <section>
    <p class="lbl">手の状態</p>
    <div class="seg" id="gOpen">
      <button class="btn" data-v="closed">門前<small>鳴きなし</small></button>
      <button class="btn" data-v="open">副露<small>鳴きあり</small></button>
    </div>
  </section>

  <section>
    <p class="lbl">翻数</p>
    <div class="seg" id="gHan"></div>
    <div class="chips hide" id="gHanMore"></div>
    <div class="seg" id="gYmul" style="margin-top:8px;display:none">
      <button class="btn" data-v="1">×1</button>
      <button class="btn" data-v="2">×2<small>ダブル</small></button>
      <button class="btn" data-v="3">×3<small>トリプル</small></button>
      <button class="btn" data-v="4">×4</button>
    </div>
  </section>

  <section>
    <p class="lbl">特殊形</p>
    <div class="row c2">
      <button class="check" id="cPinfu"><span class="txt">平和<span class="cap">門前限定</span></span><span class="sw"></span></button>
      <button class="check" id="cChiitoi"><span class="txt">七対子<span class="cap">25符固定</span></span><span class="sw"></span></button>
    </div>
  </section>

  <section id="secFu">
    <p class="lbl">刻子・槓子の数</p>
    <div class="counters" id="gMelds"></div>
    <p class="note">中張＝2〜8の数牌／么九＝1・9・字牌。ロンで完成した刻子は<b>明刻</b>として数えます。</p>
  </section>

  <section id="secPair">
    <p class="lbl">雀頭</p>
    <div class="seg" id="gPair">
      <button class="btn" data-v="0">その他<small>0符</small></button>
      <button class="btn" data-v="2">役牌<small>2符</small></button>
      <button class="btn" data-v="4">連風牌<small>4符</small></button>
    </div>
  </section>

  <section id="secWait">
    <p class="lbl">待ちの形</p>
    <div class="seg" id="gWait">
      <button class="btn" data-v="0">両面・双碰<small>0符</small></button>
      <button class="btn" data-v="2">辺張・嵌張・単騎<small>2符</small></button>
    </div>
  </section>

  <details id="dBreak">
    <summary>符の内訳</summary>
    <div class="bd" id="oBreak"></div>
  </details>

  <details>
    <summary>ルール設定</summary>
    <div class="opts">
      <button class="check" id="cKiriage"><span class="txt">切り上げ満貫<span class="cap">4翻30符・3翻60符を満貫に</span></span><span class="sw"></span></button>
      <button class="check" id="cDblWind"><span class="txt">連風牌の雀頭を2符<span class="cap">オフなら4符</span></span><span class="sw"></span></button>
    </div>
  </details>

  <button class="reset" id="bReset">入力をリセット</button>
</div>

<nav class="tabbar" aria-label="画面切り替え">
  <a href="./" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg>点数計算</a>
  <a href="index_score.html"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>スコア記録</a>
</nav>

<script>
(function(){
"use strict";

var MELDS=[
  {k:"ankoS", n:"暗刻（中張）", fu:4},
  {k:"ankoT", n:"暗刻（么九）", fu:8},
  {k:"minkoS",n:"明刻（中張）", fu:2},
  {k:"minkoT",n:"明刻（么九）", fu:4},
  {k:"ankanS",n:"暗槓（中張）", fu:16},
  {k:"ankanT",n:"暗槓（么九）", fu:32},
  {k:"minkanS",n:"明槓（中張）",fu:8},
  {k:"minkanT",n:"明槓（么九）",fu:16}
];

function fresh(){
  var m={}; MELDS.forEach(function(x){m[x.k]=0;});
  return {seat:"child",win:"ron",open:"closed",han:1,ymul:1,
          yakuman:false,pinfu:false,chiitoi:false,melds:m,pair:0,wait:0};
}
var S=fresh();
var OPT={kiriage:false,dblWind2:false};
var hanMore=false;
var HAN_RANK={5:"満貫",6:"跳満",7:"跳満",8:"倍満",9:"倍満",10:"倍満",11:"三倍満",12:"三倍満",13:"数え役満"};

/* ---------- 符 ---------- */
function calcFu(){
  var items=[],fixed=false,note="";
  if(S.chiitoi) return {fu:25,items:[["七対子（固定）",25]],fixed:true,note:""};
  if(S.pinfu){
    if(S.win==="tsumo") return {fu:20,items:[["副底",20],["平和ツモ（20符固定）",0]],fixed:true,note:""};
    return {fu:30,items:[["副底",20],["門前ロン",10]],fixed:true,note:""};
  }
  var fu=20; items.push(["副底",20]);
  if(S.open==="closed"&&S.win==="ron"){fu+=10;items.push(["門前ロン",10]);}
  if(S.win==="tsumo"){fu+=2;items.push(["ツモ",2]);}
  MELDS.forEach(function(x){
    var c=S.melds[x.k];
    if(c>0){fu+=x.fu*c;items.push([x.n+" ×"+c,x.fu*c]);}
  });
  if(S.pair>0){
    var p=(S.pair===4&&OPT.dblWind2)?2:S.pair;
    fu+=p;items.push([S.pair===4?"雀頭（連風牌）":"雀頭（役牌）",p]);
  }
  if(S.wait>0){fu+=2;items.push(["待ち（辺張・嵌張・単騎）",2]);}
  if(S.open==="open"&&fu===20){fu=30;note="喰い平和形のため30符";}
  var up=Math.ceil(fu/10)*10;
  if(up!==fu){items.push(["切り上げ",up-fu]);fu=up;}
  return {fu:fu,items:items,fixed:fixed,note:note};
}

/* ---------- 点数 ---------- */
function ceil100(v){return Math.ceil(v/100)*100;}

function calcScore(fu){
  var base,rank="";
  if(S.yakuman){base=8000*S.ymul;rank=["役満","ダブル役満","トリプル役満","四倍役満"][S.ymul-1];}
  else if(S.han>=13){base=8000;rank="数え役満";}
  else if(S.han>=11){base=6000;rank="三倍満";}
  else if(S.han>=8){base=4000;rank="倍満";}
  else if(S.han>=6){base=3000;rank="跳満";}
  else if(S.han===5){base=2000;rank="満貫";}
  else{
    base=fu*Math.pow(2,2+S.han);
    if(OPT.kiriage&&((S.han===4&&fu===30)||(S.han===3&&fu===60))){base=2000;rank="満貫";}
    if(base>=2000){base=2000;rank="満貫";}
  }
  var dealer=S.seat==="dealer";
  if(S.win==="ron"){
    var t=ceil100(base*(dealer?6:4));
    return {total:t,split:"放銃者から",rank:rank};
  }
  if(dealer){
    var e=ceil100(base*2);
    return {total:e*3,split:e.toLocaleString()+" オール（子3人）",rank:rank};
  }
  var pd=ceil100(base*2),pc=ceil100(base);
  return {total:pd+pc*2,split:"親 "+pd.toLocaleString()+"　／　子 "+pc.toLocaleString()+" ×2",rank:rank};
}

/* ---------- 描画 ---------- */
function build(){
  var h="";
  for(var i=1;i<=4;i++) h+='<button class="btn" data-v="'+i+'">'+i+'</button>';
  h+='<button class="btn more" id="bHanMore" aria-expanded="false"><span>5〜</span></button>';
  document.getElementById("gHan").innerHTML=h;
  h="";
  for(var j=5;j<=13;j++) h+='<button class="btn" data-v="'+j+'">'+(j===13?"13+":j)+'<small>'+HAN_RANK[j]+'</small></button>';
  h+='<button class="btn" data-v="Y">役満</button>';
  document.getElementById("gHanMore").innerHTML=h;

  var m=document.getElementById("gMelds"),s="";
  MELDS.forEach(function(x){
    s+='<div class="counter" data-k="'+x.k+'">'+
       '<span class="cname">'+x.n+'<span class="cfu">'+x.fu+'符</span></span>'+
       '<button class="step" data-d="-1" aria-label="'+x.n+'を減らす">−</button>'+
       '<span class="num zero">0</span>'+
       '<button class="step" data-d="1" aria-label="'+x.n+'を増やす">＋</button>'+
       '</div>';
  });
  m.innerHTML=s;
}

function pressGroup(id,val){
  document.querySelectorAll("#"+id+" .btn").forEach(function(b){
    b.setAttribute("aria-pressed", b.dataset.v===String(val) ? "true":"false");
  });
}

function render(){
  pressGroup("gSeat",S.seat);
  pressGroup("gWin",S.win);
  pressGroup("gOpen",S.open);
  pressGroup("gHan",S.yakuman?"Y":S.han);
  pressGroup("gHanMore",S.yakuman?"Y":S.han);
  var hm=document.getElementById("bHanMore"),big=S.yakuman||S.han>=5;
  hm.setAttribute("aria-pressed",big?"true":"false");
  hm.setAttribute("aria-expanded",hanMore?"true":"false");
  hm.classList.toggle("open",hanMore);
  hm.firstChild.textContent=S.yakuman?"役満":big?(S.han>=13?"13+":S.han)+"翻":"5〜";
  document.getElementById("gHanMore").classList.toggle("hide",!hanMore);
  pressGroup("gYmul",S.ymul);
  pressGroup("gPair",S.pair);
  pressGroup("gWait",S.wait);
  document.getElementById("gYmul").style.display=S.yakuman?"grid":"none";

  document.getElementById("cPinfu").setAttribute("aria-pressed",S.pinfu?"true":"false");
  document.getElementById("cChiitoi").setAttribute("aria-pressed",S.chiitoi?"true":"false");
  document.getElementById("cKiriage").setAttribute("aria-pressed",OPT.kiriage?"true":"false");
  document.getElementById("cDblWind").setAttribute("aria-pressed",OPT.dblWind2?"true":"false");
  document.getElementById("cPinfu").disabled=(S.open==="open"||S.chiitoi||S.yakuman);
  document.getElementById("cChiitoi").disabled=(S.open==="open"||S.pinfu||S.yakuman);

  var lockAll=S.chiitoi||S.pinfu||S.yakuman;
  MELDS.forEach(function(x){
    var row=document.querySelector('.counter[data-k="'+x.k+'"]');
    var c=S.melds[x.k],num=row.querySelector(".num");
    num.textContent=c;
    num.classList.toggle("zero",c===0);
    var off=lockAll||(S.open==="closed"&&(x.k==="minkanS"||x.k==="minkanT"));
    row.classList.toggle("off",off);
    row.querySelectorAll(".step").forEach(function(b){b.disabled=off;});
  });
  document.querySelectorAll("#gPair .btn, #gWait .btn").forEach(function(b){b.disabled=lockAll;});

  var f=calcFu(), sc=calcScore(f.fu);
  document.getElementById("oFu").textContent=S.yakuman?"—":f.fu;
  document.getElementById("oHan").textContent=S.yakuman?"役満":S.han;
  document.getElementById("oMain").textContent=sc.total.toLocaleString();
  document.getElementById("oSplit").textContent=sc.split;
  var r=document.getElementById("oRank");
  r.textContent=sc.rank;
  r.classList.toggle("empty",!sc.rank);

  var total=0; MELDS.forEach(function(x){total+=S.melds[x.k];});
  var w=document.getElementById("oWarn");
  if(!lockAll&&total>4){w.style.display="block";w.textContent="刻子・槓子が"+total+"組です（最大4組）";}
  else{w.style.display="none";}

  var bd=document.getElementById("oBreak"),html="";
  if(S.yakuman){html='<div class="r"><span>役満は符計算なし</span><span>—</span></div>';}
  else{
    f.items.forEach(function(it){html+='<div class="r"><span>'+it[0]+'</span><span>'+it[1]+'符</span></div>';});
    if(f.note) html+='<div class="r"><span>'+f.note+'</span><span></span></div>';
    html+='<div class="r sum"><span>合計</span><span>'+f.fu+'符</span></div>';
  }
  document.getElementById("oBreak").innerHTML=html;
}

/* ---------- 操作 ---------- */
function onGroup(id,fn){
  document.getElementById(id).addEventListener("click",function(e){
    var b=e.target.closest(".btn"); if(!b||b.disabled) return;
    fn(b.dataset.v); render();
  });
}
function clearFu(){MELDS.forEach(function(x){S.melds[x.k]=0;});S.pair=0;S.wait=0;}

build();

onGroup("gSeat",function(v){S.seat=v;});
onGroup("gWin",function(v){S.win=v;});
onGroup("gOpen",function(v){
  S.open=v;
  if(v==="open"){S.pinfu=false;S.chiitoi=false;}
  else{S.melds.minkanS=0;S.melds.minkanT=0;}
});
function setHan(v){
  if(v==="Y"){S.yakuman=true;}
  else{S.yakuman=false;S.han=parseInt(v,10);}
  hanMore=false;
}
document.getElementById("gHan").addEventListener("click",function(e){
  var b=e.target.closest(".btn"); if(!b) return;
  if(b.id==="bHanMore") hanMore=!hanMore; else setHan(b.dataset.v);
  render();
});
onGroup("gHanMore",setHan);
onGroup("gYmul",function(v){S.ymul=parseInt(v,10);});
onGroup("gPair",function(v){S.pair=parseInt(v,10);});
onGroup("gWait",function(v){S.wait=parseInt(v,10);});

document.getElementById("gMelds").addEventListener("click",function(e){
  var b=e.target.closest(".step"); if(!b||b.disabled) return;
  var k=b.closest(".counter").dataset.k, d=parseInt(b.dataset.d,10);
  S.melds[k]=Math.max(0,Math.min(4,S.melds[k]+d));
  render();
});

function toggle(id,fn){
  document.getElementById(id).addEventListener("click",function(){
    if(this.disabled) return; fn(); render();
  });
}
toggle("cPinfu",function(){S.pinfu=!S.pinfu; if(S.pinfu){S.chiitoi=false;clearFu();}});
toggle("cChiitoi",function(){S.chiitoi=!S.chiitoi; if(S.chiitoi){S.pinfu=false;clearFu();}});
toggle("cKiriage",function(){OPT.kiriage=!OPT.kiriage;});
toggle("cDblWind",function(){OPT.dblWind2=!OPT.dblWind2;});

document.getElementById("bReset").addEventListener("click",function(){
  S=fresh(); hanMore=false; render(); window.scrollTo({top:0,behavior:"smooth"});
});

render();
})();
</script>
</body>
</html>
